# lpf_demo_placeplan.yaml
# Generated by: net-to-ads agent
# Run: 2026-04-06  (Run 2)
# Source: lpf_demo_ads_import.net
# Circuit: Ideal 3rd-order Butterworth LPF (passives only)
# Topology: Term1 -- L1 -- [C1 shunt] -- L2 -- Term2

design:
  name: lpf_demo
  variant: passives_only_linear_layout
  source_file: lpf_demo_ads_import.net
  notes: >
    Passives-only LPF. No FET placement_recipes used.
    Linear layout: signal path left-to-right along y=0.
    C1 shunt hangs downward to GND.

placement_objective:
  summary: >
    Linear filter layout. Series elements (L1, L2) on main RF lane.
    Shunt element (C1) drops to GND below signal line.
    Ports at left and right ends.
  priorities:
    - clear_main_rf_path
    - series_left_to_right
    - shunt_below_signal_line
    - readable_component_spacing

functional_groups:
  - name: input_port_group
    role: input_port
    members: [Term1]
    lane: rf_main
    anchor_priority: 1

  - name: rf_path_group
    role: main_filter_passives
    members: [L1, C1, L2]
    lane: rf_main
    anchor_priority: 2

  - name: output_port_group
    role: output_port
    members: [Term2]
    lane: rf_main
    anchor_priority: 3

  - name: simulation_group
    role: simulation_control
    members: [SP1]
    lane: simulation
    anchor_priority: 4

lanes:
  - name: rf_main
    purpose: Main RF signal path (left-to-right)
    relative_position: center
    y_coordinate: 0.0

  - name: shunt_ground
    purpose: Shunt capacitor and GND references
    relative_position: below
    y_coordinate: -1.0

  - name: simulation
    purpose: S-parameter sweep controller
    relative_position: above
    y_coordinate: -3.0

ordering_constraints:
  - type: left_to_right_rf_flow
    description: Term1 at leftmost x, then L1, then C1-tap/L2, then Term2 at rightmost x.
  - type: shunt_below_signal
    description: C1 placed vertically (angle=-90) so P2 (GND) hangs below signal line.

spacing_guidance:
  component_spacing: 1.5  # units between component origins on signal path
  port_to_element_gap: 1.0
  shunt_gnd_depth: -1.0   # GND symbol placed 1 unit below C1 origin
