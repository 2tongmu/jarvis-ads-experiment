# lpf_demo_ads_buildplan.yaml
# Generated by: net-to-ads agent
# Run: 2026-04-06  (Run 2)
# Source: lpf_demo_placeplan.yaml
# Circuit: Ideal 3rd-order Butterworth LPF
#
# Coordinate system:
#   All positions are (x, y) in ADS schematic units.
#   Signal path at y=0.0, left-to-right.
#
# Pin conventions (from ads_lpf_skill_test.py, Run 1 validated):
#   ads_rflib:L   angle=0:   P1 at (x+0.0, y), P2 at (x+1.0, y)   [origin = P1]
#   ads_rflib:C   angle=-90: P1 at (x, y+0.0), P2 at (x, y-1.0)   [origin = P1=signal tap]
#   ads_simulation:Term angle=-90: RF pin at (x, y)
#   ads_rflib:GROUND angle=-90: GND pin at (x, y)
#
# Layout plan:
#   x=0.0  : Term1    RF pin at (0, 0)
#   x=1.5  : L1       P1=(1.5, 0)  P2=(2.5, 0)
#   x=3.0  : C1       P1=(3.0, 0) [tap=mid], P2=(3.0, -1.0) [GND]
#   x=4.0  : L2       P1=(4.0, 0)  P2=(5.0, 0)
#   x=6.0  : Term2    RF pin at (6, 0)
#
# GND symbols:
#   GND_C1  at (3.0, -1.0)  -- below C1
#   GND_T1  at (0.0, -1.0)  -- Term1 return
#   GND_T2  at (6.0, -1.0)  -- Term2 return
#
# S_Param controller:
#   SP1 at (1.5, -3.0)  -- below and left of circuit
#
# Wires:
#   [(0.0, 0.0), (1.5, 0.0)]    -- Term1 -> L1.P1
#   [(2.5, 0.0), (3.0, 0.0)]    -- L1.P2 -> C1.P1 (mid node)
#   [(3.0, 0.0), (4.0, 0.0)]    -- C1.P1 (mid) -> L2.P1
#   [(5.0, 0.0), (6.0, 0.0)]    -- L2.P2 -> Term2

components:
  - name: Term1
    ads_lib: ads_simulation
    ads_cell: Term
    ads_view: symbol
    x: 0.0
    y: 0.0
    angle: -90.0
    params:
      Num: "1"
      Z: "50 Ohm"

  - name: L1
    ads_lib: ads_rflib
    ads_cell: L
    ads_view: symbol
    x: 1.5
    y: 0.0
    angle: 0.0
    params:
      L: "7.958 nH"

  - name: C1
    ads_lib: ads_rflib
    ads_cell: C
    ads_view: symbol
    x: 3.0
    y: 0.0
    angle: -90.0
    params:
      C: "6.366 pF"

  - name: GND_C1
    ads_lib: ads_rflib
    ads_cell: GROUND
    ads_view: symbol
    x: 3.0
    y: -1.0
    angle: -90.0
    params: {}

  - name: L2
    ads_lib: ads_rflib
    ads_cell: L
    ads_view: symbol
    x: 4.0
    y: 0.0
    angle: 0.0
    params:
      L: "7.958 nH"

  - name: Term2
    ads_lib: ads_simulation
    ads_cell: Term
    ads_view: symbol
    x: 6.0
    y: 0.0
    angle: -90.0
    params:
      Num: "2"
      Z: "50 Ohm"

  - name: GND_T1
    ads_lib: ads_rflib
    ads_cell: GROUND
    ads_view: symbol
    x: 0.0
    y: -1.0
    angle: -90.0
    params: {}

  - name: GND_T2
    ads_lib: ads_rflib
    ads_cell: GROUND
    ads_view: symbol
    x: 6.0
    y: -1.0
    angle: -90.0
    params: {}

  - name: SP1
    ads_lib: ads_simulation
    ads_cell: S_Param
    ads_view: symbol
    x: 1.5
    y: -3.0
    angle: 0.0
    params:
      Start: "100 MHz"
      Stop: "5 GHz"
      Step: "100 MHz"

wires:
  - [[0.0, 0.0], [1.5, 0.0]]     # Term1 RF pin -> L1.P1
  - [[2.5, 0.0], [3.0, 0.0]]     # L1.P2 -> C1.P1 (mid node)
  - [[3.0, 0.0], [4.0, 0.0]]     # C1.P1 (mid) -> L2.P1
  - [[5.0, 0.0], [6.0, 0.0]]     # L2.P2 -> Term2 RF pin

nodes:
  rf_in: {x: 0.0, y: 0.0}
  mid:   {x: 3.0, y: 0.0}
  rf_out: {x: 6.0, y: 0.0}
