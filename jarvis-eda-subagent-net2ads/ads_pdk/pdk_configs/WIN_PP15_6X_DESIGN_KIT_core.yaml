# PDK configuration — component map + pin offsets (load every session)
#
# Source: build_pdk_yaml.py (live ADS probe)
# Generated: 2026-04-16

# ── PDK identity ─────────────────────────────────────────────────────────────

pdk_name: WIN_PP15_6X_DESIGN_KIT
pdk_lib_name: WIN_PP15_6X_DESIGN_KIT
pdk_lib_path: "C:\Github_folders\jarvis-ads-experiment\jarvis-eda-subagent-net2ads\ads_pdk\WIN_PP15_6X_DESIGN_KIT"
pdk_lib_defs: "C:/Github_folders/jarvis-ads-experiment/jarvis-eda-subagent-net2ads/ads_pdk/WIN_PP15_6X_DESIGN_KIT/lib.defs"

# ── Workspace setup ───────────────────────────────────────────────────────────
# Pre-write lib.defs with INCLUDE <pdk_lib_defs> BEFORE calling open_workspace().
# Do NOT use de.create_workspace() as it does not load PDK libraries.

workspace_setup:
  method: lib_defs_include
  sequence:
    - step: write_cds_lib         # cds.lib = 'softinclude lib.defs'
    - step: write_lib_defs        # INCLUDE rflib + INCLUDE pdk_lib_defs + DEFINE user_lib
    - step: open_workspace        # de.open_workspace(ws_dir) — loads all libs
  known_warnings:
    - "Syntax error in library definition file vtb.defs — benign, suppress with warnings.catch_warnings()"

# ── Component map ────────────────────────────────────────────────────────────
# Maps PDK cells to their circuit role. Used by the net2ads pipeline to select
# which PDK cell to place for a given component type in the netlist.
#
# TRANSISTOR TERMINAL RULE (applied automatically by build_pdk_yaml.py):
#   3-terminal transistor → TRANSISTOR_SWITCH  (all pins accessible, usable as switch)
#   2-terminal transistor → TRANSISTOR_AMPLIFIER (source/emitter pre-grounded, NOT a switch)

