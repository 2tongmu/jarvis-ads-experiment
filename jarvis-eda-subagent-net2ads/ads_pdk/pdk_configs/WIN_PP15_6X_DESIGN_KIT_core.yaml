# ── Pin offsets ───────────────────────────────────────────────────────────────
# Snap_point positions for each terminal at 0/90/180/270 degrees.
# Source: build_pdk_yaml.py — live ADS probe (InstPin.snap_point)
# All offsets are RELATIVE to instance placement origin.
# ⚠ InstTerm.position does NOT exist in ADS 2026 — use InstPin.snap_point

