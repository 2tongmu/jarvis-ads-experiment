# ── Workspace setup ───────────────────────────────────────────────────────────
# Pre-write lib.defs with INCLUDE <pdk_lib_defs> BEFORE calling open_workspace().
# Do NOT use de.create_workspace() as it does not load PDK libraries.

workspace_setup:
  method: lib_defs_include
  sequence:
    - step: write_cds_lib         # cds.lib = 'softinclude lib.defs'
    - step: write_lib_defs        # INCLUDE rflib + INCLUDE pdk_lib_defs + DEFINE user_lib
    - step: open_workspace        # de.open_workspace(ws_dir) — loads all libs
  known_warnings:
    - "Syntax error in library definition file vtb.defs — benign, suppress with warnings.catch_warnings()"

# ── Component map ────────────────────────────────────────────────────────────
# Maps PDK cells to their circuit role. Used by the net2ads pipeline to select
# which PDK cell to place for a given component type in the netlist.
#
# TRANSISTOR TERMINAL RULE (applied automatically by build_pdk_yaml.py):
#   3-terminal transistor → TRANSISTOR_SWITCH  (all pins accessible, usable as switch)
#   2-terminal transistor → TRANSISTOR_AMPLIFIER (source/emitter pre-grounded, NOT a switch)

component_map:

  - rfscikit_type: TRANSISTOR_SWITCH
    description: "CPW pHEMT FET — 3-port switch element"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP1561_CPW
    ads_view: symbol
    netlist_model: PP1561_CPW
    pin_count: 3
    pin_names: [gate, drain, source]
    port_mapping:
      port1: drain      # RF signal in
      port2: source     # RF signal out
      port3: gate       # DC bias control
    default_params: {}
    notes: >
      Use for series RF switch FETs (signal flows drain→source) or shunt switches.
      Gate bias network must be added separately (Rg, Cpg, Lsg as required).
      Three accessible terminals allow full control for both topologies.
      Max gate width and finger count constraints per PDK datasheet.
    typical_params:
      series_switch: {NOF: 2, UGW: "80 um"}
      shunt_switch:  {NOF: 2, UGW: "50 um"}

  - rfscikit_type: TRANSISTOR_SWITCH
    description: "CPW pHEMT FET — optimized for OIP3 (2×75 µm)"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP1561_CPW_OIP3_2X75
    ads_view: symbol
    netlist_model: PP1561_CPW_OIP3_2X75
    pin_count: 3
    pin_names: [gate, drain, source]
    port_mapping:
      port1: drain      # RF signal in
      port2: source     # RF signal out
      port3: gate       # DC bias control
    default_params: {}
    notes: >
      Variant optimized for third-order output intercept point (OIP3) distortion metrics.
      Configuration: 2 fingers × 75 µm unit gate width.
      Use for amplifier or switch stages where OIP3 performance is critical.
    typical_params:
      series_switch: {NOF: 2, UGW: "75 um"}
      shunt_switch:  {NOF: 2, UGW: "50 um"}

  - rfscikit_type: TRANSISTOR_SWITCH
    description: "CPW pHEMT FET — optimized for OIP3 (4×75 µm), DCP variant"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP1561_CPW_OIP3_4X75
    ads_view: symbol
    netlist_model: dcp
    pin_count: 3
    pin_names: [gate, drain, source]
    port_mapping:
      port1: drain      # RF signal in
      port2: source     # RF signal out
      port3: gate       # DC bias control
    default_params:
      NOF: 2
      Ugw: "75.0 um"
      Temp: 25
      ExtP1: NO
      ExtP2: NO
      W: 150
      L: 0.15
      ExportName: dcp
      Status: Data_verification
      NOISE: 1
    notes: >
      Variant for OIP3 with 4 fingers × 75 µm unit gate width (total 300 µm).
      DCP (Drift-Compensated Poisson) model variant with enhanced distortion modeling.
      Minimum UGW: 10 µm when MET2T layer is 4 µm.
      Bell-shaped prediction curve not included in this model.
    typical_params:
      series_switch: {NOF: 4, UGW: "75 um"}
      shunt_switch:  {NOF: 2, UGW: "50 um"}

  - rfscikit_type: TRANSISTOR_SWITCH
    description: "Low-signal pHEMT switch (LS_S variant)"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP1561_SW_LS_S
    ads_view: symbol
    netlist_model: PP1561_SW_LS_S
    pin_count: 3
    pin_names: [gate, drain, source]
    port_mapping:
      port1: drain      # RF signal in
      port2: source     # RF signal out
      port3: gate       # DC bias control
    default_params: {}
    notes: >
      Low-signal RF switch variant (LS_S) — optimized for low-power switching with
      minimal parasitic capacitance. Good for integrated switch matrices and antenna switches.
      Do NOT use for shunt switch if gate-source capacitance is critical.
      Accessible gate, drain, source terminals enable custom bias networks.
    typical_params:
