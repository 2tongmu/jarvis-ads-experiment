  - rfscikit_type: INDUCTOR
    description: "Square spiral inductor — symmetric variant"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_SInd
    ads_view: symbol
    netlist_model: SYM_SInd
    pin_count: 2
    pin_names: [port1, port2]
    port_mapping:
      port1: p1
      port2: p2
    default_params: {}
    notes: >
      Symmetrical square spiral with optimized coupling and Q.
      Best-in-class for impedance matching and differential bias.
      Use for balanced RF networks, broadband transformers, and LNA tail inductors.

  - rfscikit_type: DIODE
    description: "Schottky diode — PP1561 variant"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP1561_DIODE
    ads_view: symbol
    netlist_model: PP1561_DIODE
    pin_count: 2
    pin_names: [anode, cathode]
    port_mapping:
      port1: anode
      port2: cathode
    default_params: {}
    notes: >
      Schottky diode for RF detection, switching, and protection.
      Suitable for detector circuits, attenuators, and limiters.
      Anode (a1) to positive bias; cathode to ground or negative.

  - rfscikit_type: DIODE
    description: "Finger-grounded Schottky diode — PP1561"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP1561_FGDIODE
    ads_view: symbol
    netlist_model: PP1561_FGDIODE
    pin_count: 2
    pin_names: [anode, cathode]
    port_mapping:
      port1: anode
      port2: cathode
    default_params: {}
    notes: >
      Finger-grounded Schottky diode with integrated substrate tie for low inductance.
      Superior RF performance for fast switching and detection.
      Use in MMIC power detector and limiter circuits.

  - rfscikit_type: TRANSISTOR_AMPLIFIER
    description: "Micro-strip FET (MS) — source-grounded variant"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP1561_MS
    ads_view: symbol
    netlist_model: PP1561_MS
    pin_count: 2
    pin_names: [gate, drain]
    port_mapping:
      port1: drain     # RF signal / collector
      port2: gate      # DC bias control
    default_params: {}
    notes: >
      Two-terminal FET with source permanently pre-grounded inside the PDK cell.
      CANNOT be used as a series or shunt RF switch (source node inaccessible).
      Suitable for amplifier topologies where source is already grounded.
      Use gate for DC bias; drain for RF signal connection.

  - rfscikit_type: INTERCONNECT_ELEMENT
    description: "Bump contact — die attach or substrate interconnect"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP156X_Bump
    ads_view: symbol
    netlist_model: PP156X_Bump
    pin_count: 2
    pin_names: [port1, port2]
    port_mapping:
      port1: p1
      port2: p2
    default_params: {}
    notes: >
      Bump contact model for flip-chip or hybrid assembly interconnect.
      Includes parasitic inductance and resistance of bond/solder bump.
      Use in high-frequency designs requiring accurate interconnect parasitics.

  - rfscikit_type: INTERCONNECT_ELEMENT
    description: "Conductor overfill model — substrate cover/vias"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP156X_COV
    ads_view: symbol
    netlist_model: PP156X_COV
    pin_count: 2
    pin_names: [port1, port2]
    port_mapping:
      port1: p1
      port2: p2
    default_params: {}
    notes: >
      Parasitic model for conductor overfill region and via substrate effects.
      Includes mutual coupling and substrate loss effects.
      Use in layout extraction and full-system EM co-simulation.

  - rfscikit_type: PASSIVE_EM
    description: "2-layer EM-simulated structure (SL2_EM)"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP156X_SL2_EM
    ads_view: symbol
    netlist_model: PP156X_SL2_EM
    pin_count: 2
    pin_names: [port1, port2]
    port_mapping:
      port1: p1
      port2: p2
    default_params: {}
    notes: >
      Two-layer EM-simulated passive element (likely spiral or coupler).
      Model derived from full-wave EM simulation — high accuracy.
      Use for transformer, coupler, or filter designs requiring frequency-dependent coupling.

  - rfscikit_type: VARACTOR_DIODE
    description: "Bias-variable varactor diode (bv2t)"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: PP156X_bv2t
    ads_view: symbol
    netlist_model: PP156X_bv2t
    pin_count: 2
    pin_names: [anode, cathode]
    port_mapping:
      port1: anode
      port2: cathode
    default_params: {}
    notes: >
      Bias-variable varactor diode for tunable filters and phase shifters.
      Capacitance varies with reverse bias voltage (bv = bias voltage).
      Two terminals: anode (cathode connect) and bias control (P2).
      Use in VCO, tunable matching, and electronically-scanned antenna circuits.

  - rfscikit_type: DIODE
    description: "Schottky diode — symmetric symbol variant"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_DIODE
    ads_view: symbol
    netlist_model: SYM_DIODE
    pin_count: 2
    pin_names: [anode, cathode]
    port_mapping:
      port1: anode
      port2: cathode
    default_params: {}
    notes: >
      Standard Schottky diode with symmetric symbol representation.
      Suitable for detection, switching, and protection circuits.
      Anode to positive bias; cathode to signal or ground.

  - rfscikit_type: CONTACT_ELEMENT
    description: "E-field grounded gate contact — low-inductance interconnect"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_EGcontact
    ads_view: symbol
    netlist_model: SYM_EGcontact
    pin_count: 2
    pin_names: [port1, port2]
    port_mapping:
      port1: p1
      port2: p2
    default_params: {}
    notes: >
      E-field contact element for low-inductance gate grounding.
      Reduces parasitic inductance in FET gate-to-ground path.
      Use in distributed amplifier and high-frequency switch layouts.

  - rfscikit_type: INTERCONNECT_ELEMENT
    description: "Conductor overfill — PP15_6X technology"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_PP15_6X_COV
    ads_view: symbol
    netlist_model: SYM_PP15_6X_COV
    pin_count: 2
    pin_names: [port1, port2]
    port_mapping:
      port1: p1
      port2: p2
    default_params: {}
    notes: >
      Process-optimized conductor overfill model for PP15_6X.
      Captures via-to-substrate coupling and lossy substrate effects.
      Use in co-simulated layout extractions and EM analysis.

  - rfscikit_type: DIODE
    description: "Schottky diode — PP15_6X technology variant"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_PP15_6X_DIODE
    ads_view: symbol
    netlist_model: SYM_PP15_6X_DIODE
    pin_count: 2
    pin_names: [anode, cathode]
    port_mapping:
      port1: anode
      port2: cathode
    default_params: {}
    notes: >
      PP15_6X-optimized Schottky diode for detection and switching.
      Process-matched model for consistent PDK co-design.
      Use in MMIC and hybrid power detector, log detector circuits.

  - rfscikit_type: TRANSISTOR_AMPLIFIER
    description: "Microstrip FET (MS) — PP15_6X source-grounded variant"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_PP15_6X_MS
    ads_view: symbol
    netlist_model: SYM_PP15_6X_MS
    pin_count: 2
    pin_names: [gate, drain]
    port_mapping:
      port1: drain     # RF signal / collector
      port2: gate      # DC bias control
    default_params: {}
    notes: >
      Two-terminal MS (microstrip FET) with source pre-grounded.
      CANNOT be used as RF switch — source node inaccessible.
      Use only for amplifier stages where source is already grounded.
      Gate bias and drain RF connections — all control is accessible.

  - rfscikit_type: TRANSISTOR_AMPLIFIER
    description: "Single-sided MS FET — PP15_6X (MS_SS)"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_PP15_6X_MS_SS
    ads_view: symbol
    netlist_model: SYM_PP15_6X_MS_SS
    pin_count: 2
    pin_names: [gate, drain]
    port_mapping:
      port1: drain     # RF signal / collector
      port2: gate      # DC bias control
    default_params: {}
    notes: >
      Single-sided MS FET variant for layout density and reduced coupling.
      Source pre-grounded (2-port, amplifier-only topology).
      Do NOT use for switches. Good for distributed amplifier unit cells.

  - rfscikit_type: CONTACT_ELEMENT
    description: "Source contact element — low inductance substrate tie"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_SCON
    ads_view: symbol
    netlist_model: SYM_SCON
    pin_count: 2
    pin_names: [port1, port2]
    port_mapping:
      port1: p1
      port2: p2
    default_params: {}
    notes: >
      Low-inductance source contact for efficient substrate grounding.
      Reduces parasitic inductance in source-to-ground path.
      Use in FET bias networks and power distribution interconnects.

  - rfscikit_type: INTERCONNECT_ELEMENT
    description: "Via stack model — multi-layer interconnect"
    ads_lib: WIN_PP15_6X_DESIGN_KIT
    ads_cell: SYM_STACK
    ads_view: symbol
    netlist_model: SYM_STACK
    pin_count: 2
    pin_names: [port1, port2]
    port_mapping:
      port1: p1
      port2: p2
    default_params: {}
    notes: >
      Multi-layer via stack model including parasitic L and R.
      Captures interconnect loss and inductance in vertical paths.
      Use in full-chip co-simulation and extraction flow.

# ── Ideal passives (no PDK swap needed) ───────────────────────────────────────
# Use ads_rflib components for ideal R/L/C in schematic (Phase 1 passives).
# These are used for layout-level parasitics, pad models, and interconnect.
# PDK-optimized versions (PP156X_TFR, PP156XCAPA, etc.) are in component_map
# and are swapped in during Phase 2 (detailed layout/placement).

ideal_passives:
  - type: R
    ads_lib: ads_rflib
    ads_cell: R
    keep_when: "pad parasitics, interconnect pi-model, gate bias stubs (Phase 1)"
  - type: L
    ads_lib: ads_rflib
    ads_cell: L
    keep_when: "bond pad inductance, interconnect pi-model, gate bias choke"
  - type: C
    ads_lib: ads_rflib
    ads_cell: C
    keep_when: "pad shunt capacitance, interconnect pi-model"

